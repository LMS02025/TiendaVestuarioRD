  --f-mono:"DM Mono", ui-monospace, Menlo, monospace;

/* Paleta tomada de la foto: muro azul petróleo, madera clara, estantes blancos y luz cálida */
:root{--bg:#F5F8F9; --surface:#FFFFFF; --ink:#16384F; --muted:#587080; --line:#DAE4EA;
  --girl:#DA5470; --girl-soft:#FCE6EB; --boy:#2A80B3; --boy-soft:#E0EEF6; --sun:#F2B33D; --sun-ink:#3A2600;
  --brass:#A86F38; --wall:#3A79A2; --glass:rgba(255,255,255,.8); --floor:rgba(245,248,249,.84)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1E28; --surface:#16293A; --ink:#EAF2F6; --muted:#9DB2C0; --line:#24394A;

*{box-sizing:border-box}
body{background:var(--wall);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}

/* Cabecera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;height:var(--hh)}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap;background:none;border:0;padding:0}
.logo .mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:conic-gradient(from 200deg,var(--girl),var(--sun),var(--mint),var(--boy),var(--girl))}
.logo .mark svg{width:24px;height:24px}
.logo b{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1}
.logo small{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--muted);margin-top:3px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:42px;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:0 14px 0 40px}
.search input:focus{border-color:var(--boy);outline:none}
.search svg{position:absolute;left:14px;top:12px;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.iconbtn{height:42px;min-width:42px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 11px;position:relative;font-weight:700;font-size:14px;transition:transform .15s,border-color .15s,background .15s}
.iconbtn:hover{border-color:var(--ink)}
.iconbtn:active{transform:scale(.93)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn .lbl{display:none}
.iconbtn.tourbtn{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.iconbtn.ownerbtn[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink);border-color:var(--sun)}
.count{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--girl);color:#fff;font:500 11px/20px var(--f-mono);text-align:center;padding:0 5px}
.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.3) rotate(-8deg)}60%{transform:scale(.92)}}
.hide-sm{display:none}
@media (min-width:720px){.hide-sm{display:inline-flex}}
@media (min-width:980px){.iconbtn .lbl{display:inline}}
@media (max-width:520px){.logo .txt{display:none}}

/* Fondo: foto de la tienda con movimiento (acercamiento lento, paralaje, luces que respiran, brillo del piso y polvo de luz) */
.scene{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--wall)}
.scene .par{position:absolute;left:50%;top:50%;width:max(112vw,199vh);height:max(63vw,112vh);transform:translate3d(-50%,-50%,0);will-change:transform}
.scene .photo{position:absolute;inset:0;animation:kb 34s ease-in-out infinite alternate;transform-origin:50% 60%}

.scene .lamp{position:absolute;width:4.2%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,246,220,.95) 0,rgba(255,226,170,.45) 30%,transparent 70%);mix-blend-mode:screen;animation:glow 4.6s ease-in-out infinite alternate}
.scene .lamp::after{content:"";position:absolute;left:50%;top:55%;width:520%;height:900%;transform:translateX(-50%);background:linear-gradient(to bottom,rgba(255,232,185,.32),rgba(255,232,185,0) 85%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);filter:blur(3px);mix-blend-mode:screen;opacity:.55}
@keyframes glow{from{opacity:.55;transform:translate(-50%,-50%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
.scene .shine{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(100deg,transparent 30%,rgba(255,240,215,.38) 45%,transparent 60%);background-size:260% 100%;mix-blend-mode:screen;animation:shine 11s ease-in-out infinite;-webkit-mask-image:linear-gradient(to top,#000 40%,transparent);mask-image:linear-gradient(to top,#000 40%,transparent)}
@keyframes shine{0%{background-position:120% 0}100%{background-position:-20% 0}}
.scene .dust{position:absolute;border-radius:50%;background:rgba(255,248,230,.9);filter:blur(1px);mix-blend-mode:screen;animation:dust linear infinite}
@keyframes dust{0%{transform:translate(0,0);opacity:0}15%{opacity:.8}85%{opacity:.6}100%{transform:translate(var(--dx),-140px);opacity:0}}
.scene .veil{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(12,34,50,.22),transparent 28%,transparent 62%,rgba(12,34,50,.38))}
/* Estantes de madera bajo cada vitrina, como en la foto */
.track{background:linear-gradient(to bottom,transparent calc(100% - 10px),#E2AE79 calc(100% - 10px),#C08048 calc(100% - 3px),rgba(0,0,0,.16) calc(100% - 3px));padding-bottom:20px}
.floor{background:var(--floor);-webkit-backdrop-filter:blur(14px) saturate(1.1);backdrop-filter:blur(14px) saturate(1.1)}

/* Vitrina de portada: arcos claros de cristal sobre el paisaje, colores que rotan al compás */
@property --at{syntax:'<color>';inherits:true;initial-value:#FBE3EA}
.vitrine{position:relative;overflow:hidden;isolation:isolate}
.vt{display:grid;gap:26px;padding-block:30px 30px;align-items:center}
@media (min-width:900px){.vt{grid-template-columns:.92fr 1.08fr;gap:44px;padding-block:56px 48px}}
.vt-copy{display:grid;gap:12px;max-width:48ch;min-width:0;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid color-mix(in srgb,var(--surface) 60%,transparent);border-radius:24px;padding:24px}
.vt-copy .eyebrow{color:var(--brass);letter-spacing:.26em;font-size:11px}
.vt-copy h1{font-size:clamp(44px,8vw,88px);line-height:.9;font-weight:500;letter-spacing:-.02em}
.vt-copy h1 em{display:block;font-style:italic;font-weight:400;color:var(--brass);font-size:.5em;letter-spacing:.02em;margin-top:6px}
.vt-copy .tag{font-family:var(--f-display);font-style:italic;font-size:clamp(19px,2.4vw,24px);line-height:1.25;margin:0}
.vt-copy p{margin:0;color:var(--muted)}
.rule{width:64px;height:1px;background:var(--brass)}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.ctas button{height:46px;padding:0 24px;border-radius:0;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;border:1px solid var(--ink);background:var(--ink);color:var(--bg);transition:background .25s,color .25s,border-color .25s}
.ctas button.ol{background:transparent;color:var(--ink)}
.ctas button:hover{background:var(--brass);border-color:var(--brass);color:#fff}
.contact{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;padding-top:10px;border-top:1px solid var(--line)}
.contact b{font-family:var(--f-mono);font-weight:500;font-size:15px;color:var(--ink);user-select:all}
.contact a,.contact button{font-size:12px;font-weight:800;border-radius:999px;padding:6px 12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.contact a{background:#1FAF5A;border-color:#1FAF5A;color:#fff}
.musicpill{justify-self:start;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 10px;font-size:13px;font-weight:700}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;height:4px;background:var(--brass);border-radius:1px}
body.music .eq i{animation:eq .7s ease-in-out infinite alternate}
body.music .eq i:nth-child(2){animation-delay:-.25s}body.music .eq i:nth-child(3){animation-delay:-.5s}
@keyframes eq{to{height:14px}}
.windows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(8px,1.6vw,18px);align-items:end;min-width:0}
.arch{border:0;padding:0;position:relative;aspect-ratio:3/5;max-width:100%;border-radius:999px 999px 4px 4px;overflow:hidden;color:#1E1B3A;
  background:radial-gradient(120% 60% at 50% 0%,rgba(255,255,255,.95),transparent 62%),linear-gradient(180deg,#FFFFFF 10%,var(--at) 100%);
  box-shadow:inset 0 0 0 1px var(--brass),inset 0 0 0 7px rgba(255,255,255,.92),inset 0 0 0 8px color-mix(in srgb,var(--brass) 55%,transparent),0 26px 34px -26px rgba(30,27,58,.55);
  transition:transform .45s cubic-bezier(.2,.8,.2,1),--at 1.6s ease}
.arch.mid{aspect-ratio:3/5.7}
.arch:hover{transform:translateY(-6px)}
.arch::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.65) 45%,transparent 55%);transform:translateX(-120%);animation:sheen 7s ease-in-out infinite;pointer-events:none}
.arch.mid::after{animation-delay:-2.3s}.arch:last-child::after{animation-delay:-4.6s}
@keyframes sheen{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.arch .beam{position:absolute;left:50%;top:-6%;width:130%;height:82%;background:conic-gradient(from 160deg at 50% 0%,transparent 0deg,rgba(255,214,120,.22) 20deg,transparent 40deg);animation:beam 7s ease-in-out infinite alternate;pointer-events:none}
@keyframes beam{from{transform:translateX(-56%)}to{transform:translateX(-44%)}}
.arch .plinth{position:absolute;left:16%;right:16%;bottom:20%;height:6%;background:linear-gradient(180deg,#E8B684,#C08048);border-top:2px solid #F4D2AE;box-shadow:0 8px 10px -6px rgba(30,27,58,.35)}
.piece{position:absolute;left:14%;right:14%;bottom:25%;aspect-ratio:1/1;opacity:0;transform:translateY(16px) scale(.92);transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
.piece.on{opacity:1;transform:none}
.piece svg{width:100%;height:100%;filter:drop-shadow(0 14px 10px rgba(30,27,58,.28))}
.arch .lbl{position:absolute;left:0;right:0;bottom:4%;text-align:center;font-size:9px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:#5B5776}
.arch .lbl b{display:block;font-family:var(--f-display);font-weight:400;font-style:italic;letter-spacing:0;text-transform:none;font-size:clamp(15px,2.2vw,24px);color:#8A5426;line-height:1.1}
.ticker{overflow:hidden;white-space:nowrap;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-block:1px solid color-mix(in srgb,var(--brass) 45%,transparent)}
.ticker div{display:inline-flex;padding-block:11px;font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);animation:tick 48s linear infinite}
.wa{position:fixed;z-index:34;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px));display:inline-flex;align-items:center;gap:8px;height:52px;min-width:52px;padding:0 15px;border-radius:999px;background:#1FAF5A;color:#fff;text-decoration:none;font-weight:800;font-size:14px;box-shadow:0 14px 26px -12px rgba(0,0,0,.5);transition:transform .2s}
.wa:hover{transform:translateY(-3px)}
.wa svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wa span{display:none}
@media (min-width:860px){.wa{bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 24px))}.wa span{display:inline}}
body.touring .wa{display:none}
.ticker span{padding-right:22px}
.ticker span::before{content:"";display:inline-block;width:5px;height:5px;background:var(--brass);transform:rotate(45deg);margin-right:22px;vertical-align:2px}
@keyframes tick{to{transform:translateX(-50%)}}

/* Departamentos */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-block:14px 6px}
.door{border:2px solid transparent;border-radius:var(--r);padding:16px;text-align:left;display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .2s;position:relative;overflow:hidden}
.door:hover{transform:translateY(-3px)}
.door.g{background:var(--girl-soft);color:var(--ink)}
.door.b{background:var(--boy-soft);color:var(--ink)}
.door[aria-pressed="true"].g{border-color:var(--girl)}
.door[aria-pressed="true"].b{border-color:var(--boy)}
.door strong{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4vw,34px);line-height:1}
.door span{font-size:13px;color:var(--muted);grid-column:1}
.door svg{grid-row:1/3;grid-column:2;width:clamp(54px,9vw,84px);height:auto;transition:transform .4s}
.door:hover svg{transform:rotate(-8deg) scale(1.08)}

/* Barra de edades */
.ages{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:20;background:var(--floor);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.ages .wrap{display:flex;gap:8px;align-items:center;padding-block:10px;overflow-x:auto;scrollbar-width:none}
.ages .wrap::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;white-space:nowrap;transition:all .15s;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.tag{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.chip small{font-family:var(--f-mono);font-size:11px;opacity:.7}
.ages .lab{flex:none;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* Secciones y vitrinas */
.dept{padding-block:26px 6px}
.dept-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:6px 16px;padding-bottom:6px;border-bottom:2px solid var(--dc)}
.dept-head h2{font-size:clamp(30px,4.6vw,46px);line-height:1;color:var(--dc)}
.dept-head p{margin:0;color:var(--muted);font-size:14px;max-width:52ch}
.dept.g{--dc:var(--girl);--dsoft:var(--girl-soft)}
.dept.b{--dc:var(--boy);--dsoft:var(--boy-soft)}
.row{padding-block:18px 4px;border-radius:var(--r);transition:background .4s,box-shadow .4s}
.row.spot{background:var(--dsoft);box-shadow:0 0 0 3px var(--dc)}
.row-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-inline:4px;margin-bottom:10px}

.track{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(158px,44vw,226px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 16px;scrollbar-width:thin;overscroll-behavior-x:contain}
.track>*{scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-block:16px 30px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}

.card{background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;min-width:0}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow)}
.tile{border:0;padding:0;background:color-mix(in srgb,var(--c) 26%,var(--surface));aspect-ratio:1/1;max-width:100%;width:100%;position:relative;display:grid;place-items:center;overflow:hidden}
.tile svg{width:70%;height:70%;filter:drop-shadow(0 8px 8px rgba(0,0,0,.14));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .tile svg{animation:sway 1.2s ease-in-out infinite}
.card:hover .tile img{transform:scale(1.06)}
@keyframes sway{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-6px)}}
.badges{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:4px;pointer-events:none}
.badge{font:500 11px var(--f-mono);padding:3px 7px;border-radius:6px;background:var(--surface);color:var(--ink)}
.badge.sale{background:var(--sale);color:#fff}
.badge.photo{background:var(--ink);color:var(--bg)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{margin:0;font-size:12px;color:var(--muted);font-weight:700}
.info h4{font-size:15px;font-weight:700;line-height:1.3}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:auto}
.price b{font:500 16px var(--f-mono);font-variant-numeric:tabular-nums}
.price b.off{color:var(--sale)}
.price s{font:500 12px var(--f-mono);color:var(--muted)}
.actions{display:flex;gap:6px}
.add{flex:1;border:0;background:var(--ink);color:var(--bg);border-radius:10px;height:38px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,transform .1s}
.add:hover{background:var(--dc,var(--girl));color:#fff}
.add:active{transform:scale(.96)}
.add svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4}
.edit{display:none;border:0;border-radius:10px;height:38px;width:42px;background:var(--sun);color:var(--sun-ink);align-items:center;justify-content:center}
.edit svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
body.admin .edit{display:flex}
.empty{color:var(--muted);padding:30px 4px;text-align:center}

/* Tienda en modo dueña */
.ownerbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:25;background:var(--sun);color:var(--sun-ink)}
.ownerbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:9px;font-size:14px;font-weight:700}
.ownerbar .sp{flex:1;min-width:0}
.ownerbar button{border:0;border-radius:999px;padding:7px 14px;font-weight:800;background:var(--sun-ink);color:var(--sun)}
.ownerbar button.ghost{background:transparent;border:1.5px solid var(--sun-ink);color:var(--sun-ink)}
.ownerbar button:disabled{opacity:.45;cursor:not-allowed}
body.admin .ages{top:calc(env(safe-area-inset-top,0px) + var(--hh) + 50px)}

/* Recorrido */
.tour{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;z-index:45;width:min(560px,calc(100% - 24px));background:var(--ink);color:var(--bg);border-radius:20px;padding:12px 14px 14px;display:grid;gap:8px;box-shadow:var(--shadow);transition:all .35s cubic-bezier(.2,.8,.2,1)}
.tour.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
@media (min-width:860px){.tour{bottom:24px}}
.tour .t1{display:flex;align-items:center;gap:10px}
.tour .t1 p{margin:0;flex:1;min-width:0;font-size:14px}
.tour .t1 p b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px}
.tour .t1 button{border:0;border-radius:999px;padding:7px 12px;background:var(--bg);color:var(--ink);font-weight:800;font-size:13px}
.road{position:relative;height:30px}
.road::before{content:"";position:absolute;left:0;right:0;top:20px;border-top:2px dashed color-mix(in srgb,var(--bg) 45%,transparent)}
.road i{position:absolute;top:16px;width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--bg) 35%,transparent);transform:translateX(-5px);transition:background .3s}
.road i.done{background:var(--sun)}
.road .cart{position:absolute;top:-2px;left:0;width:30px;height:28px;transform:translateX(-15px);transition:left 1.1s cubic-bezier(.45,0,.2,1)}
.road .cart svg{width:30px;height:28px;animation:bounce .5s ease-in-out infinite alternate}
@keyframes bounce{to{transform:translateY(-3px)}}

/* Paneles */
.scrim{position:fixed;inset:0;background:rgba(14,12,32,.55);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:60;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:24px}
.dbody{flex:1;overflow-y:auto;padding:14px 18px;display:grid;gap:12px;align-content:start}
.dfoot{border-top:1px solid var(--line);padding:14px 18px;display:grid;gap:8px}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.line .th{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;overflow:hidden;background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.line .th svg{width:74%;height:74%}
.line .th img{width:100%;height:100%;object-fit:cover}
.line p{margin:0;font-size:14px;font-weight:700;line-height:1.3}
.line small{color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;gap:6px;margin-top:4px}
.qty button{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:800}
.sum{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.sum.total{color:var(--ink);font-weight:800;font-size:17px}
.sum span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--mint);transition:width .5s}
.note{font-size:12px;color:var(--muted);margin:0}
.btn{height:46px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:800;font-size:15px;transition:filter .15s,transform .1s;padding:0 18px}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:700}
.form input,.form select{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;width:100%}
.form input:focus,.form select:focus{border-color:var(--ink);outline:none}
.pay{display:flex;gap:6px;flex-wrap:wrap}
.pay label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:600}
.pay input{height:auto;width:auto}

.modal{position:fixed;left:50%;top:50%;z-index:60;width:min(780px,calc(100% - 24px));max-height:calc(100% - 40px);overflow-y:auto;background:var(--surface);border-radius:22px;
  transform:translate(-50%,-44%) scale(.96);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.2,1)}
.modal.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}

.compare .tile{border-radius:12px}

.card{background:transparent;border:1px solid color-mix(in srgb,#fff 55%,transparent);box-shadow:0 10px 26px -18px rgba(0,0,0,.55)}

 '<div><p class="meta" style="margin-bottom:6px">Elige la talla</p><div class="sizes" id="sizes">'+sz.map(function(s,i){return '<button data-size="'+esc(s)+'" aria-pressed="'+(i===0)+'">'+esc(s)+'</button>'}).join('')+'</div></div>'+
 '<button class="btn" id="qvAdd">Agregar al carrito</button>'+(S.admin?'<button class="btn sun" id="qvEdit">Cambiar foto y precio</button>':'')+'</div></div>';
 openPanel('#quick');sfx('pop');
 $('#sizes').onclick=function(ev){var b=ev.target.closest('[data-size]');if(!b)return;$$('#sizes button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});sfx('tick')};
 $('#qvAdd').onclick=function(){var s=$('#sizes [aria-pressed="true"]').dataset.size;burstAt(null,$('#qvAdd'));addToCart(id,s,$('#quick .tile'));closePanel()};
 if(S.admin)$('#qvEdit').onclick=function(){editor(id)};
}

/* ---------- Modo dueña ---------- */
var CAP={art:null,assets:null,tried:false};
function caps(){if(CAP.tried)return Promise.resolve(CAP);
 var c=window.claude;if(!c||!c.use)return Promise.resolve(CAP);CAP.tried=true;
 return Promise.all([c.use('artifact').catch(function(){return null}),c.use('assets').catch(function(){return null})]).then(function(r){CAP.art=r[0];CAP.assets=r[1];return CAP})}
function setAdmin(on){S.admin=on;document.body.classList.toggle('admin',on);$('#ownerbar').hidden=!on;$('#ownerBtn').setAttribute('aria-pressed',String(on));
 try{on?sessionStorage.setItem('vrd-owner','1'):sessionStorage.removeItem('vrd-owner')}catch(e){}
 if(on)caps();updPending();render()}
function updPending(){var n=Object.keys(PENDING).length;$('#pendInfo').textContent=n?n+' cambio'+(n>1?'s':'')+' sin publicar':'';$('#pubBtn').disabled=!n;$('#discardBtn').hidden=!n}
var draft=null;
function editor(id){var p=BY[id],e=eff(p);draft={id:id,blob:null,url:null,remove:false};
 $('#editor').innerHTML='<button class="iconbtn close" data-close aria-label="Cerrar">✕</button><form class="mbody form" id="edForm"><span class="eyebrow" style="color:var(--muted)">'+DEPTS[p.d].name+' · '+AGES[p.age].lab+'</span><h2>'+esc(nm(p))+'</h2>'+
 '<label class="drop" id="drop" for="photo">'+I.cam+'<b>Tomar foto o elegir de la galería</b><span class="note">Cambia la foto, el nombre o el precio. La foto se recorta cuadrada, se ajusta en brillo y color y se guarda a 1600 × 1600 px.</span><input id="photo" type="file" accept="image/*" capture="environment" hidden></label>'+
 '<div class="compare"><figure><div class="tile" style="--c:'+p.color+'">'+visual(p)+'</div><figcaption>Actual</figcaption></figure><figure><div class="tile" id="newTile" style="--c:'+p.color+'">'+visual(p)+'</div><figcaption id="newCap">Nueva</figcaption></figure></div>'+
 '<label for="pname">Nombre del producto<input id="pname" maxlength="60" autocomplete="off" value="'+esc(nm(p))+'"></label><div class="two"><label for="price">Precio (RD$)<input id="price" type="number" min="50" step="10" inputmode="numeric" value="'+e.now+'"></label><label>&nbsp;<button type="button" class="btn ghost" id="rmPhoto"'+(e.img?'':' disabled')+'>Quitar foto</button></label></div>'+
 '<p class="err" id="edErr"></p><button class="btn sun" type="submit" id="edSave">Guardar cambio</button><p class="note">Los cambios quedan listos para publicar desde la barra amarilla; así se publican varios juntos.</p></form>';
 openPanel('#editor');
 var inp=$('#photo'),drop=$('#drop');
 inp.onchange=function(){if(inp.files[0])processPhoto(inp.files[0])};
 drop.addEventListener('dragover',function(ev){ev.preventDefault();drop.classList.add('over')});
 drop.addEventListener('dragleave',function(){drop.classList.remove('over')});
 drop.addEventListener('drop',function(ev){ev.preventDefault();drop.classList.remove('over');var f=ev.dataTransfer.files[0];if(f)processPhoto(f)});
 $('#rmPhoto').onclick=function(){draft.remove=true;draft.blob=null;$('#newTile').innerHTML=art(p.type,p.color);$('#newCap').textContent='Nueva · ilustración';sfx('tick')};
 $('#edForm').onsubmit=function(ev){ev.preventDefault();saveEdit()};
}
function processPhoto(file){var err=$('#edErr');err.textContent='';$('#newCap').textContent='Procesando…';
 var url=URL.createObjectURL(file),img=new Image();
 img.onload=function(){var s=Math.min(img.naturalWidth,img.naturalHeight),N=Math.min(1600,Math.max(600,s));
  var cv=document.createElement('canvas');cv.width=cv.height=N;var x=cv.getContext('2d');x.imageSmoothingQuality='high';
  try{x.filter='brightness(1.04) contrast(1.08) saturate(1.1)'}catch(e){}
  x.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,N,N);URL.revokeObjectURL(url);
  cv.toBlob(function(b){if(!b){err.textContent='No se pudo procesar esta imagen. Prueba con una foto JPG o PNG.';return}
   draft.blob=b;draft.remove=false;draft.small=null;
   var sm=document.createElement('canvas');sm.width=sm.height=720;sm.getContext('2d').drawImage(cv,0,0,720,720);draft.small=sm.toDataURL('image/jpeg',.8);
   $('#newTile').innerHTML='<img src="'+URL.createObjectURL(b)+'" alt="Foto nueva">';$('#newCap').textContent='Nueva · '+N+' × '+N+' px';sfx('pop')},'image/jpeg',.88)};
 img.onerror=function(){err.textContent='Este archivo no es una imagen que el navegador pueda abrir. Usa JPG o PNG.';$('#newCap').textContent='Nueva';sfx('error')};
 img.src=url}
function saveEdit(){var id=draft.id,err=$('#edErr'),price=Math.round(+$('#price').value);
 if(!price||price<50){err.textContent='Escribe un precio válido, por ejemplo 1290.';sfx('error');return}
 var nmv=$('#pname').value.trim().replace(/\s+/g,' ');if(!nmv){err.textContent='Escribe el nombre del producto.';sfx('error');return}
 var btn=$('#edSave');btn.disabled=true;
 var chg={price:price};if(nmv!==BY[id].name)chg.name=nmv;else if(ov(id).name)chg.name=null;
 var done=function(){PENDING[id]=Object.assign(PENDING[id]||{},chg);updPending();render();closePanel();sfx('add');toast('Cambio guardado. Pulsa “Publicar cambios” para que lo vean las clientas.')};
 if(draft.remove){chg.img=null;done();return}
 if(!draft.blob){done();return}
 btn.textContent='Subiendo foto…';
 caps().then(function(c){if(!c.assets)throw {code:'no_assets'};return c.assets.upload(draft.blob)})
 .then(function(r){chg.img=r.url;done()})
 .catch(function(){chg.img=draft.small;done()});
}
function regen(state){
 var css=document.getElementById('css').textContent,app=document.getElementById('app').textContent;
 var json=JSON.stringify(state).replace(/</g,'\\u003c');
 return SKEL+HEADBITS+'<style id="css">'+css+'<\/style>\n<\/head>\n<body>\n<script type="application/json" id="state">'+json+'<\/script>\n<div id="root"><\/div>\n<script id="app">'+app+'<\/script>\n</body></html>'}
function downloadSite(next){var blob=new Blob([regen(next)],{type:'text/html'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
 PUB=next;PENDING={};LOCAL={};try{localStorage.removeItem('vrd-kids-local')}catch(x){}
 updPending();render();sfx('done');toast('Se descargó index.html con tus cambios. Súbelo a GitHub para publicarlo.')}
function publish(){var n=Object.keys(PENDING).length;if(!n)return;var b=$('#pubBtn');b.disabled=true;b.textContent='Publicando…';
 var next={v:1,overrides:JSON.parse(JSON.stringify(PUB.overrides))};
 Object.keys(PENDING).forEach(function(id){var o=Object.assign({},next.overrides[id]||{},PENDING[id]);if(o.img===null)delete o.img;if(o.name===null)delete o.name;next.overrides[id]=o});
 caps().then(function(c){if(!c.art)return downloadSite(next);return c.art.publish(regen(next)).then(function(){sfx('done');toast('Publicado. La tienda se actualiza para todas las clientas.')})})
 .catch(function(e){var code=e&&e.code;
  if(code==='conflict'){toast('Alguien publicó antes; la tienda se recarga con la versión nueva.');return}
  Object.keys(PENDING).forEach(function(id){LOCAL[id]=Object.assign(LOCAL[id]||{},PENDING[id])});
  try{localStorage.setItem('vrd-kids-local',JSON.stringify(LOCAL))}catch(x){}
  PENDING={};updPending();render();sfx('error');
  toast(code==='too_large'?'Las fotos pesan demasiado para publicar; quedaron guardadas solo en este dispositivo.':'Esta vista no puede publicar la tienda. Los cambios quedaron guardados solo en este dispositivo.')})
 .then(function(){b.textContent='Publicar cambios';updPending()})}

/* ---------- Recorrido ---------- */
var tour={on:false,i:0,stops:[],t:null};
function startTour(){if(S.q){S.q='';$('#q').value='';render()}
 tour.stops=[{el:'#inicio',label:'La vitrina',txt:'Colecciones de Niñas, Bebé y Niños'}].concat($$('.row').map(function(r){return {el:'#'+r.id,label:r.dataset.label,txt:r.querySelectorAll('.card').length+' productos en esta vitrina'}}));
 tour.stops.push({el:'footer',label:'Pedidos y envíos',txt:'Desde San Cristóbal a todo el país · WhatsApp '+WAT});
 tour.on=true;tour.i=0;paused=true;
 $('#road').innerHTML=tour.stops.map(function(s,i){return '<i style="left:'+(4+i/(tour.stops.length-1)*92)+'%"></i>'}).join('')+'<span class="cart" id="tcart">'+I.cartArt+'</span>';
 $('#tour').classList.add('on');document.body.classList.add('touring');step()}
function step(){clearTimeout(tour.t);if(!tour.on)return;
 if(tour.i>=tour.stops.length){endTour(true);return}
 var s=tour.stops[tour.i],el=$(s.el);$$('.row.spot').forEach(function(r){r.classList.remove('spot')});
 var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(el){el.scrollIntoView({behavior:rm?'auto':'smooth',block:'center'});
  if(el.classList.contains('row')){el.classList.add('spot');var tr=el.querySelector('.track');setTimeout(function(){if(tour.on&&tr)tr.scrollTo({left:tr.scrollWidth,behavior:rm?'auto':'smooth'})},1300);setTimeout(function(){if(tr)tr.scrollTo({left:0,behavior:rm?'auto':'smooth'})},2900)}
  }
 $('#tourText').innerHTML='<b>'+esc(s.label)+'</b>'+esc(s.txt);
 $('#tcart').style.left=(4+tour.i/(tour.stops.length-1)*92)+'%';
 $$('#road i').forEach(function(d,j){d.classList.toggle('done',j<=tour.i)});
 sfx('bell');tour.i++;tour.t=setTimeout(step,3800)}
function endTour(fin){tour.on=false;document.body.classList.remove('touring');clearTimeout(tour.t);paused=false;$('#tour').classList.remove('on');$$('.row.spot').forEach(function(r){r.classList.remove('spot')});if(fin){sfx('done');toast('¡Recorriste toda la tienda! Revisa tu carrito cuando quieras.')}}

/* ---------- Eventos ---------- */
document.addEventListener('click',function(ev){var t=ev.target;
 var b;
 if(b=t.closest('[data-close]')){closePanel();return}
 if(t.id==='scrim'){closePanel();return}
 if(b=t.closest('[data-add]')){burstAt(ev,b);addToCart(b.dataset.add,null,b.closest('.card').querySelector('.tile'));return}
 if(b=t.closest('[data-edit]')){editor(b.dataset.edit);return}
 if(b=t.closest('[data-open]')){burstAt(ev,b);quick(b.dataset.open);return}
 if(b=t.closest('[data-sc]')){var tr=b.closest('.row').querySelector('.track');tr.scrollBy({left:+b.dataset.sc*tr.clientWidth*.8,behavior:'smooth'});sfx('tick');return}
 if(b=t.closest('[data-arch]')){var k=b.dataset.arch;S.q='';$('#q').value='';S.tag=null;if(k==='0'){S.dept='all';S.age=0}else{S.dept=k;S.age=-1}render();sfx('pop');setTimeout(function(){$('#catalog').scrollIntoView({behavior:'smooth'})},50);return}
 if(b=t.closest('.door')){S.dept=S.dept===b.dataset.dept?'all':b.dataset.dept;render();sfx('pop');return}
 if(b=t.closest('[data-qd]')){S.dept=b.dataset.qd;S.q='';$('#q').value='';render();sfx('pop');$('#dept-'+S.dept).scrollIntoView({behavior:'smooth'});return}
 if(b=t.closest('[data-age]')){S.age=+b.dataset.age;render();sfx('tick');return}
 if(t.closest('#clearTag')){S.tag=null;render();sfx('tick');return}
 if(b=t.closest('[data-go]')){window.scrollTo({top:0,behavior:'smooth'});return}
 if(b=t.closest('[data-q]')){var l=S.cart[+b.dataset.q];l.q+=+b.dataset.dq;if(l.q<=0)S.cart.splice(+b.dataset.q,1);saveCart();updCount();renderCart();sfx('tick');return}
 if(b=t.closest('[data-copy]')){var num=$('#waNum');var ok=function(){toast('Número copiado: '+WAT)};try{navigator.clipboard.writeText(WAT).then(ok,function(){selNum(num)})}catch(x){selNum(num)}return}
 if(t.closest('#ckBtn')){ckMode=true;renderCart();sfx('pop');setTimeout(function(){$('#nm')&&$('#nm').focus()},50);return}
});
document.addEventListener('submit',function(ev){if(ev.target.id!=='ckForm')return;ev.preventDefault();
 var code='VRD-'+Math.floor(1000+Math.random()*9000),sub=0,lines=S.cart.map(function(l){var p=BY[l.id],e=eff(p);sub+=e.now*l.q;return '• '+l.q+' × '+nm(p)+' (talla '+l.s+') — '+money(e.now*l.q)});
 var zsel=$('#prov'),zone=zsel.options[zsel.selectedIndex].text,sh=sub>=3500?0:ship(zsel.value);
 var msg='Hola, soy '+$('#nm').value.trim()+'. Quiero confirmar el pedido '+code+' de Vestuario RD Kids:\n'+lines.join('\n')+'\nEnvío ('+zone+'): '+(sh?money(sh):'gratis')+'\nTotal: '+money(sub+sh)+'\nTeléfono: '+$('#tel').value.trim();
 S.cart=[];saveCart();updCount();ckMode=false;
 $('#cartBody').innerHTML='<div style="text-align:center;padding:30px 0;display:grid;gap:12px;justify-items:center">'+I.cartArt.replace('<svg','<svg width="90" height="80"')+'<p style="margin:0;font-family:var(--f-display);font-size:24px">¡Gracias por tu pedido!</p><p class="note" style="font-size:14px">Pedido <b class="mono">'+code+'</b> registrado por <b class="mono">'+money(sub+sh)+'</b>. Envíalo por WhatsApp para coordinar la entrega desde '+PLACE+'.</p><a class="btn" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:#1FAF5A;color:#fff" href="'+esc(waLink(msg))+'" target="_blank" rel="noopener">'+I.chat.replace('<svg','<svg width="20" height="20" style="fill:none;stroke:#fff;stroke-width:2"')+'Enviar pedido por WhatsApp</a><p class="note">Número: <b class="mono" style="user-select:all">'+WAT+'</b></p></div>';$('#cartFoot').innerHTML='';sfx('done')});
$('#cartBtn').onclick=openCart;$('#cartBtn2').onclick=openCart;
$('#tourBtn').onclick=function(){tour.on?endTour():startTour()};$('#tourBtn2').onclick=function(){tour.on?endTour():startTour()};
$('#tourStop').onclick=function(){endTour()};
$('#musicBtn').onclick=toggleMusic;$('#musicPill').onclick=toggleMusic;
$('#soundBtn').onclick=function(){S.sound=!S.sound;try{localStorage.setItem('vrd-sound',S.sound?'1':'0')}catch(e){}this.innerHTML=(S.sound?I.sound:I.mute)+'<span class="lbl">Sonido</span>';this.setAttribute('aria-pressed',String(S.sound));if(S.sound)sfx('pop')};
if(!S.sound){$('#soundBtn').innerHTML=I.mute+'<span class="lbl">Sonido</span>';$('#soundBtn').setAttribute('aria-pressed','false')}
$('#ownerBtn').onclick=function(){if(S.admin){setAdmin(false);toast('Saliste del modo edición.');return}$('#pw').value='';$('#pwErr').textContent='';openPanel('#owner')};
$('#ownerForm').onsubmit=function(ev){ev.preventDefault();if($('#pw').value===OWNER_KEY){closePanel();setAdmin(true);sfx('unlock');toast('Modo edición activo')}
 else{$('#pwErr').textContent='Clave incorrecta. Intenta de nuevo.';var f=$('#ownerForm');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');sfx('error')}};
$('#exitOwner').onclick=function(){setAdmin(false);toast('Saliste del modo edición.')};
$('#pubBtn').onclick=publish;
$('#discardBtn').onclick=function(){PENDING={};updPending();render();toast('Cambios descartados.')};
var qt=null;$('#q').addEventListener('input',function(e){clearTimeout(qt);qt=setTimeout(function(){S.q=e.target.value.trim();render()},180)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(openEl)closePanel();else if(tour.on)endTour()}});

render();updCount();if(S.admin)setAdmin(true);
})();
</script>
